[project]
name = "data-quality-monitor"
version = "0.1.0"
description = "Freshness, volume, schema, null-rate and drift monitors with alert routing, backtested on real CAL FIRE data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pydantic>=2.8,<3",
    "pyyaml>=6",
]

[project.scripts]
dqmon = "dqmon.cli:main"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6", "scipy>=1.13", "types-pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqmon"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "DTZ"]
ignore = ["S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]
"src/dqmon/inject.py" = ["S311"]
"src/dqmon/backtest.py" = ["S311"]

[tool.mypy]
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
