name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, types, tests, backtest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -v
      - name: Backtest report is up to date
        run: |
          uv run dqmon backtest
          git diff --exit-code docs/backtest.md docs/backtest.json
      - name: Replay the real feed through the production path
        run: |
          {
            echo '### Alert transitions on the real 2021 feed'
            echo '```'
            uv run dqmon replay --no-deliver
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
